# SSS2-GUI reverse proxy (Raspberry Pi production).
#
# WHY THIS EXISTS
#   The Svelte frontend (adapter-node, port 3000) and the FastAPI backend
#   (uvicorn, port 8000) are separate processes. The browser calls "/api/..."
#   on the page origin, but the Node server has no /api routes, so every
#   request 404s ("No interfaces found", "Disconnected", etc.). This config
#   puts both behind one origin (port 80) and routes /api to the backend.
#
#   Keep VITE_API_BASE=/api (the deploy-pi.sh default) when using this.
#
# INSTALL (on the Pi)
#   sudo apt-get install -y nginx
#   sudo cp scripts/nginx/sss2-gui.conf /etc/nginx/sites-available/sss2-gui
#   sudo ln -sf /etc/nginx/sites-available/sss2-gui /etc/nginx/sites-enabled/sss2-gui
#   sudo rm -f /etc/nginx/sites-enabled/default      # avoid the default page hijacking "/"
#   sudo nginx -t && sudo systemctl reload nginx
#
#   Then browse to  http://<pi-ip>/   (port 80, NOT :3000).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Backend API + WebSocket. The /api prefix is preserved (FastAPI mounts its
    # routers at /api), so DO NOT add a trailing slash to proxy_pass here.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # /api/connection/ws upgrade
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;                        # keep long-lived WS open
    }

    # Everything else -> SvelteKit adapter-node server.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
